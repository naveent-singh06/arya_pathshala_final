<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#14213d" />
    <meta name="description" content="ARYA PATHSHALA - an AI-powered learning platform with an AI Tutor, attendance and academic management." />
  
    <!-- Favicon Setup -->
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png" />
  
    <!-- Apple Touch Icon -->
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/favicon-32x32.png" />
  
    <!-- Manifest for PWA -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
  
    <title>ARYA PATHSHALA</title>
    <!-- Brand images for CSS (public/assets); declared here because the bundler only resolves relative CSS urls. -->
    <style>:root{--ap-img-classroom:url(/assets/classroom-bg.svg);--ap-img-logo-wm:url(/assets/arya-pathshala-logo-transparent.png)}</style>
    <!-- Apply the saved theme before the first paint so there is no flash. Keep in step with src/theme/themes.js. -->
    <script>
      (function () {
        var t = 'white-glass';
        try {
          var v = window.localStorage.getItem('ap-theme');
          if (v === 'white-glass' || v === 'midnight-dark' || v === 'cosmic-night' || v === 'neon-aurora') t = v;
        } catch (e) {}
        document.documentElement.setAttribute('data-ap-theme', t);
      })();
    </script>
  </head>
  
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
  </body>
</html>
